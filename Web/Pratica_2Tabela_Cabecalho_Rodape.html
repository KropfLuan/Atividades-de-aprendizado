<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Prática 2 - Tabelas</title>
    </head>
    <body>
        <h1>Tabela com cabeçalho e rodapé</h1>
        <table width="50%" border="1">
            <thead></thead>
                <tr>
                    <th>Mês</th>
                    <th>Horas/Aula</th>
                </tr>
            </thead>
            <tbody>
            <tr>
                <td>Junho</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Julho</td>
                <td>50</td>
            </tr>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>100</th>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
